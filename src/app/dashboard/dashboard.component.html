<brd-header [(isOpenedPanel)]="isOpenedWidgetPanel"></brd-header>
<section
  class="slds-container_fluid app-container"
  [class.container-shrink]="isOpenedWidgetPanel"
  *ngIf="!isLoadingWidgets; else loadingBlock"
>
  <div style="position: relative; display: flex; flex-direction: row-reverse">
    <brd-widget-panel
      [openPanel]="isOpenedWidgetPanel"
      [addedWidgetConfig]="widgetConfigs"
      (dragStart)="onWidgetDragStart($event)"
    ></brd-widget-panel>
    <div class="slds-col slds-p-around_medium">
      <brd-page-filter-widget
        (selected)="setFilterState($event)"
        [endDate]="(endDate$ | async)!"
        [startDate]="(startDate$ | async)!"
        [totalApplicants]="(totalApplicants$ | async)!"
      ></brd-page-filter-widget>
      <section
        #gridSection
        (dragover)="onDragOver($event)"
        (drop)="onWidgetDrop($event)"
        [ngClass]="{ 'slds-drop-zone ': isOpenedWidgetPanel }"
        class="slds-container_fluid slds-grid slds-grid_flex-start slds-wrap slds-gutters slds-gutters_xxx-small"
        [class.slds-drop-zone]="isOpenedWidgetPanel"
      >
        <ng-container
          *ngFor="let widgetConfig of widgetConfigs; let index = index"
        >
          <brd-widget-wrapper
            [class]="widgetConfig.component | widgetGridSizeClass"
            [config]="widgetConfig"
            [widgetInEditMode]="isOpenedWidgetPanel"
            (removeWidget)="removeWidget($event)"
            (dragAction)="onWidgetDragAction(index, $event)"
            (dragStart)="onWidgetDragStart($event)"
          ></brd-widget-wrapper>
        </ng-container>
      </section>
    </div>
  </div>
</section>

<ng-template #loadingBlock>
  <ngl-spinner
    size="large"
    variant="brand"
    alternativeText="Loading"
  ></ngl-spinner
></ng-template>
