<div
  #chartContainer
  class="slds-text-align_center slds-m-around_x-small u-overflow-hidden u-w-100 u-height-100"
>
  <canvas
    baseChart
    class="container"
    [data]="data"
    [options]="doughnutOptions"
    [legend]="barChartLegend"
    [type]="doughnutChartType"
    [ngStyle]="{ 'height.px': chartHeight, 'width.px': chartHeight }"
    *ngIf="data$ | async as data"
  >
  </canvas>
</div>
